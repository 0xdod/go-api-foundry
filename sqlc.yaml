version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/**/*.sql"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        sql_package: "pgx/v5"
        out: "sqlc"
        emit_db_tags: true
        overrides:
          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: "github.com/shopspring/decimal.NullDecimal"
          - db_type: "numeric"
            nullable: false
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "numeric"
            nullable: true
            go_type: "github.com/shopspring/decimal.NullDecimal"
          - db_type: "uuid"
            nullable: false
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
